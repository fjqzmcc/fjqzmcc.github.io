<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fef9f0">
  <title>页面未找到 - MergeDoku</title>
  <link rel="icon" type="image/png" href="app-icon.png">
  <style>
    :root { --bg:#fef9f0; --bg-2:#fdf4e5; --text:#4a3e3d; --muted:#8c7e7a; --accent:#8c4b36; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Nunito","PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background:linear-gradient(180deg,var(--bg),var(--bg-2)); min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
    .box img { width:88px; height:88px; border-radius:20px; margin-bottom:20px; box-shadow:0 12px 28px rgba(140,126,122,.15); }
    h1 { font-size:44px; font-weight:900; color:var(--accent); }
    p { color:var(--muted); margin:12px 0 24px; }
    a { display:inline-block; background:var(--accent); color:#fff; padding:12px 24px; border-radius:12px; font-weight:700; text-decoration:none; }
    a:hover { opacity:.9; }
  </style>
</head>
<body>
  <div class="box">
    <img src="app-icon.png" alt="MergeDoku">
    <h1>404</h1>
    <p>抱歉，您访问的页面不存在。</p>
    <a href="/">返回首页</a>
  </div>
</body>
</html>
